<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Image Viewer</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 700px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,.2);
        text-align: center;
    }

    iframe {
        width: 100%;
        height: 450px;
        border: 2px solid #ccc;
        border-radius: 8px;
        background: white;
    }

    .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    button {
        padding: 10px 24px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #007bff;
        color: white;
        transition: .3s;
    }

    button:hover:not(:disabled) {
        background: #0056b3;
    }

    button:disabled {
        background: #bdbdbd;
        cursor: not-allowed;
    }

    .counter {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">

    <iframe id="imageFrame"></iframe>

    <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
    </div>

    <div class="counter" id="counter"></div>

</div>

<script>
    // Array of image URLs
    const images = [
        "https://dheerajarora1997.github.io/aws-notes/AWS-IAM.png",
        "https://dheerajarora1997.github.io/AWS-auto-scaling.png",
        "https://dheerajarora1997.github.io/AWS-cicd-pipeline.png",
        "https://dheerajarora1997.github.io/AWS-cloud-architecture-ecosystem.png",
        "https://dheerajarora1997.github.io/AWS-cloud-architecture.png",
        "https://dheerajarora1997.github.io/AWS-storage-services.png",
        "https://dheerajarora1997.github.io/AWS-well-architecture-framework.png"
    ];

    let currentIndex = 0;

    const iframe = document.getElementById("imageFrame");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counter = document.getElementById("counter");

    function loadImage() {

        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body{
                        margin:0;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        height:100vh;
                        background:#eee;
                    }

                    img{
                        max-width:100%;
                        max-height:100%;
                        object-fit:contain;
                    }
                </style>
            </head>
            <body>
                <img src="${images[currentIndex]}" alt="Image">
            </body>
            </html>
        `;

        iframe.srcdoc = html;

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === images.length - 1;

        counter.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            loadImage();
        }
    });

    nextBtn.addEventListener("click", () => {
        if (currentIndex < images.length - 1) {
            currentIndex++;
            loadImage();
        }
    });

    loadImage();
</script>

</body>
</html>
